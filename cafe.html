<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신병 연구소 - 카페테리아</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @font-face {
        font-family: "SEBANG Gothic Bold";
        src: url("SEBANG Gothic OTF Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --accent: #ff008c;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ff008c;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        font-weight: 400;
        overflow: hidden;

        background-image:
          linear-gradient(rgba(255, 133, 218, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 133, 218, 0.12) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      * {
        box-sizing: border-box;
      }

      /* 굵은 폰트(세방고딕) 적용 */
      strong,
      b,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "SEBANG Gothic Bold", sans-serif !important;
        font-weight: 700 !important;
      }

      /* 배경 그리드 패턴 */
      .grid-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 61, 129, 0.07) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 61, 129, 0.07) 1px,
            transparent 1px
          );
        background-size: 50px 50px;
        z-index: -1;
        pointer-events: none;
      }

      /* 요청하신 크기 및 마진 스타일 그대로 적용 */
      #left-branding {
        position: absolute;
        top: 30px;
        left: 90px;
        width: 650px;
        z-index: 2000;
        pointer-events: none;
      }

      .logo-link {
        display: inline-block;
        pointer-events: auto;
        width: 130px;
        margin-bottom: 10px;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .logo-img {
        height: auto;
        width: 100%;
        display: block;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      .logo-link:hover .logo-img {
        opacity: 1;
      }

      /* 커스텀 스크롤바 (webkit) */
      .custom-scroll {
        scrollbar-width: thin;
        scrollbar-color: lch(58.21% 75.61 6.25 / 0.478) #0d0d0d;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: lch(58.21% 75.61 6.25 / 0.478);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background-color: #ff6da7;
        background-clip: content-box;
      }

      @keyframes likePop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(1);
        }
      }
      .like-pop {
        animation: likePop 0.25s ease;
      }
    </style>
  </head>
  <body>
    <div class="grid-background"></div>

    <!-- 요청하신 스타일이 적용된 로고 영역 -->
    <div id="left-branding">
      <button class="logo-link" onclick="window.location.href = 'index.html'">
        <img src="로고-04.png" alt="신병 연구소 로고" class="logo-img" />
      </button>
    </div>

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const colors = {
        bg: "#0a0a0a",
        panel: "#222222",
        panelAlt: "#0a0a0a",
        line: "#2A2830",
        pink: "#ff008c",
        pinkSoft: "#FF9EC4",
        pinkDim: "#59243C",
        text: "#F3EFF2",
        textMuted: "#8F8B93",
      };

      const fontDisplay =
        "'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
      const fontMono = "'JetBrains Mono', 'SF Mono', 'Consolas', monospace";

      const initialGossips = [
        {
          id: 1,
          type: "얼죽아병",
          nickname: "얼어죽으려고",
          content:
            "손이 얼어붙어도 난 아아를 마셔야겠어 따뜻한 거 너무 맛없어...",
          likes: 0,
        },
        {
          id: 2,
          type: "갓생병",
          nickname: "얘랑 살기 힘들다",
          content:
            "자꾸 갓생 살겠다고 새벽 5시에 알람 맞추는데 안 일어나 그냥 나만 억울하게 일찍 일어난 사람 됨",
          likes: 0,
        },
        {
          id: 3,
          type: "집병",
          nickname: "아집가고싶다",
          content: "집에 있어도 집 가고싶고 나가도 집 가고싶고 ",
          likes: 0,
        },
        {
          id: 4,
          type: "밈각병",
          nickname: "영크크",
          content: "내가 얼마나 도파민 중독인건지 감도 안 옴",
          likes: 0,
        },
      ];

      function LikeButton({ count, onLike }) {
        const [pop, setPop] = useState(false);

        function handleClick() {
          onLike();
          setPop(true);
          setTimeout(() => setPop(false), 250);
        }

        return (
          <button
            onClick={handleClick}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              marginLeft: "auto",
              background: "transparent",
              border: `1px solid ${colors.line}`,
              borderRadius: 999,
              padding: "4px 11px",
              cursor: "pointer",
              color: colors.pinkSoft,
              fontFamily: fontMono,
              fontSize: 12.5,
              transition: "border-color 0.15s ease, color 0.15s ease",
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.borderColor = colors.pink;
              e.currentTarget.style.color = colors.pink;
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.borderColor = colors.line;
              e.currentTarget.style.color = colors.pinkSoft;
            }}
          >
            <span className={pop ? "like-pop" : ""} style={{ fontSize: 13 }}>
              ♥
            </span>
            <span>{count}</span>
          </button>
        );
      }

      function GossipBoard({ gossips, onLike }) {
        return (
          <section
            style={{
              flex: 1,
              display: "flex",
              flexDirection: "column",
              minHeight: 0,
              background: "#0d0d0d",
              borderRight: `1px solid ${colors.line}`,
            }}
          >
            <div
              style={{
                padding: "28px 30px 18px",
                borderBottom: `1px solid ${colors.line}`,
              }}
            >
              <h2
                style={{
                  fontFamily: fontDisplay,
                  fontSize: 26,
                  fontWeight: 800,
                  color: colors.text,
                  margin: 0,
                }}
              >
                신규 신병 게시판
              </h2>
            </div>

            <div
              className="custom-scroll"
              style={{
                flex: 1,
                overflowY: "auto",
                padding: "18px 30px 30px",
                display: "flex",
                flexDirection: "column",
                gap: 14,
              }}
            >
              {gossips.length === 0 ? (
                <p style={{ color: colors.textMuted, fontFamily: fontDisplay }}>
                  아직 접수된 신병이 없습니다. 오른쪽에서 첫 사례를 신고해
                  주세요.
                </p>
              ) : (
                gossips.map((g) => (
                  <article
                    key={g.id}
                    style={{
                      background: colors.panelAlt,
                      border: `1px solid ${colors.line}`,
                      borderRadius: 4,
                      borderLeft: `3px solid ${colors.pink}`,
                      padding: "16px 18px",
                    }}
                  >
                    <div
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        marginBottom: 8,
                      }}
                    >
                      <span
                        style={{
                          fontFamily: fontDisplay,
                          fontSize: 13,
                          fontWeight: 700,
                          color: colors.bg,
                          background: colors.pink,
                          borderRadius: 3,
                          padding: "2px 9px",
                        }}
                      >
                        {g.type}
                      </span>
                      <span
                        style={{
                          fontFamily: fontMono,
                          fontSize: 12,
                          color: colors.textMuted,
                        }}
                      >
                        {g.nickname}
                      </span>
                      <LikeButton
                        count={g.likes || 0}
                        onLike={() => onLike(g.id)}
                      />
                    </div>
                    <p
                      style={{
                        margin: 0,
                        fontFamily: fontDisplay,
                        fontSize: 14.5,
                        lineHeight: 1.6,
                        color: colors.text,
                      }}
                    >
                      {g.content}
                    </p>
                  </article>
                ))
              )}
            </div>
          </section>
        );
      }

      function ReportForm({ onSubmit }) {
        const [nickname, setNickname] = useState("");
        const [diseaseName, setDiseaseName] = useState("");
        const [detail, setDetail] = useState("");
        const [justSubmitted, setJustSubmitted] = useState(false);

        const isValid = nickname.trim() && diseaseName.trim() && detail.trim();

        function handleSubmit(e) {
          e.preventDefault();
          if (!isValid) return;

          const newEntry = {
            id: Date.now(),
            type: diseaseName.trim(),
            nickname: nickname.trim(),
            content: detail.trim(),
            likes: 0,
          };

          onSubmit(newEntry);

          setNickname("");
          setDiseaseName("");
          setDetail("");
          setJustSubmitted(true);
          setTimeout(() => setJustSubmitted(false), 1800);
        }

        const inputStyle = {
          width: "100%",
          boxSizing: "border-box",
          background: colors.bg,
          border: `1px solid ${colors.line}`,
          borderRadius: 4,
          padding: "11px 13px",
          fontFamily: fontDisplay,
          fontSize: 14,
          color: colors.text,
          outline: "none",
        };

        const labelStyle = {
          display: "block",
          fontFamily: fontMono,
          fontSize: 11.5,
          color: colors.textMuted,
          letterSpacing: 0.5,
          marginBottom: 6,
        };

        return (
          <section
            style={{
              flex: 1,
              display: "flex",
              flexDirection: "column",
              minHeight: 0,
              background: "#0d0d0d",
            }}
          >
            <div
              style={{
                padding: "28px 30px 18px",
                borderBottom: `1px solid ${colors.line}`,
              }}
            >
              <h2
                style={{
                  fontFamily: fontDisplay,
                  fontSize: 26,
                  fontWeight: 800,
                  color: colors.text,
                  margin: 0,
                }}
              >
                신규 신병 신고 센터
              </h2>
            </div>

            <form
              onSubmit={handleSubmit}
              className="custom-scroll"
              style={{
                flex: 1,
                overflowY: "auto",
                padding: "24px 30px 30px",
                display: "flex",
                flexDirection: "column",
                gap: 18,
              }}
            >
              <div>
                <label style={labelStyle}>닉네임</label>
                <input
                  style={inputStyle}
                  type="text"
                  value={nickname}
                  onChange={(e) => setNickname(e.target.value)}
                  placeholder="예: 익명의 환자"
                  maxLength={20}
                />
              </div>

              <div>
                <label style={labelStyle}>신병 명칭</label>
                <input
                  style={inputStyle}
                  type="text"
                  value={diseaseName}
                  onChange={(e) => setDiseaseName(e.target.value)}
                  placeholder="예: 인스타병"
                  maxLength={20}
                />
              </div>

              <div
                style={{ flex: 1, display: "flex", flexDirection: "column" }}
              >
                <label style={labelStyle}>증상 상세 내용</label>
                <textarea
                  style={{
                    ...inputStyle,
                    flex: 1,
                    minHeight: 140,
                    resize: "vertical",
                    lineHeight: 1.6,
                    fontFamily: fontDisplay,
                  }}
                  value={detail}
                  onChange={(e) => setDetail(e.target.value)}
                  placeholder="어떤 증상을 겪고 계신가요? 솔직하게 작성해 주세요."
                  maxLength={300}
                />
              </div>

              <button
                type="submit"
                disabled={!isValid}
                style={{
                  marginTop: 4,
                  padding: "13px 0",
                  border: "none",
                  borderRadius: 4,
                  fontFamily: fontDisplay,
                  fontSize: 15,
                  fontWeight: 700,
                  cursor: isValid ? "pointer" : "not-allowed",
                  background: isValid ? colors.pink : colors.pinkDim,
                  color: isValid ? colors.bg : colors.textMuted,
                  transition: "opacity 0.15s ease",
                }}
              >
                {justSubmitted ? "접수 완료" : "접수하기"}
              </button>
            </form>
          </section>
        );
      }

      function CafeteriaPage() {
        const [gossips, setGossips] = useState(() => {
          const saved = localStorage.getItem("sinbyung_gossips");
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              // 기존 저장 데이터에 likes 필드가 없을 경우 보정
              return parsed.map((g) => ({ likes: 0, ...g }));
            } catch (e) {
              console.error("데이터 파싱 실패", e);
            }
          }
          return initialGossips;
        });

        useEffect(() => {
          localStorage.setItem("sinbyung_gossips", JSON.stringify(gossips));
        }, [gossips]);

        function handleAddGossip(entry) {
          setGossips((prev) => [entry, ...prev]);
        }

        function handleLike(id) {
          setGossips((prev) =>
            prev.map((g) =>
              g.id === id ? { ...g, likes: (g.likes || 0) + 1 } : g,
            ),
          );
        }

        return (
          <div
            style={{
              height: "100vh",
              width: "100%",
              display: "flex",
              padding: "75px 90px 60px 90px",
              background: "transparent",
              fontFamily: fontDisplay,
              gap: "24px",
            }}
          >
            <div
              style={{
                display: "flex",
                width: "100%",
                height: "100%",
                border: `1px solid ${colors.line}`,
                borderRadius: "8px",
                overflow: "hidden",
              }}
            >
              <GossipBoard gossips={gossips} onLike={handleLike} />
              <ReportForm onSubmit={handleAddGossip} />
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<CafeteriaPage />);
    </script>
  </body>
</html>

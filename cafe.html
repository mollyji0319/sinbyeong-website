<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신병 연구소 - 카페테리아</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap");

      /* SEBANG Gothic OTF 폰트 정의 */
      @font-face {
        font-family: "SEBANG Gothic";
        src: url("SEBANG Gothic OTF.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }

      :root {
        --accent: #ff008c;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ff008c;
        font-family: "SEBANG Gothic", "Noto Sans KR", sans-serif;
        font-weight: 400;
        overflow: hidden;

        background-image:
          linear-gradient(rgba(255, 133, 218, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 133, 218, 0.12) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      * {
        box-sizing: border-box;
      }

      /* 배경 그리드 패턴 */
      .grid-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 61, 129, 0.07) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 61, 129, 0.07) 1px,
            transparent 1px
          );
        background-size: 50px 50px;
        z-index: -1;
        pointer-events: none;
      }

      #left-branding {
        position: absolute;
        top: 30px;
        left: 90px;
        width: 650px;
        z-index: 2000;
        pointer-events: none;
      }

      .logo-link {
        display: inline-block;
        pointer-events: auto;
        width: 130px;
        margin-bottom: 10px;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .logo-img {
        height: auto;
        width: 115%;
        display: block;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      .logo-link:hover .logo-img {
        opacity: 1;
      }

      /* 커스텀 스크롤바 (webkit) */
      .custom-scroll {
        scrollbar-width: thin;
        scrollbar-color: lch(58.21% 75.61 6.25 / 0.478) #0d0d0d;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: lch(58.21% 75.61 6.25 / 0.478);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background-color: #ff6da7;
        background-clip: content-box;
      }

      @keyframes likePop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(1);
        }
      }
      .like-pop {
        animation: likePop 0.25s ease;
      }
    </style>
  </head>
  <body>
    <div class="grid-background"></div>

    <div id="left-branding">
      <button class="logo-link" onclick="window.location.href = 'index.html'">
        <img src="로고-04.png" alt="신병 연구소 로고" class="logo-img" />
      </button>
    </div>

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const colors = {
        bg: "#0a0a0a",
        panel: "#222222",
        panelAlt: "#0a0a0a",
        line: "#2A2830",
        pink: "#ff008c",
        pinkSoft: "#FF9EC4",
        pinkDim: "#59243C",
        text: "#F3EFF2",
        textMuted: "#8F8B93",
      };

      const fontSebang = "'SEBANG Gothic', sans-serif";
      const fontNoto = "'Noto Sans KR', sans-serif";
      const fontMono = "'JetBrains Mono', 'SF Mono', 'Consolas', monospace";

      const initialGossips = [
        {
          id: 1,
          type: "창억떡병",
          nickname: "천안도 창억떡 생겨줘제발",
          content: "창억떡먹고싶어 죽는 병",
          likes: 97,
        },
        {
          id: 2,
          type: "집병",
          nickname: "집좀..",
          content: "저 집에 가고싶어요",
          likes: 184,
        },
        {
          id: 3,
          type: "페르소나하고싶다",
          nickname: "아마미야렌",
          content:
            "아 나 지금 펠리스 들어가서 미친놈들 개심시켜야하는데 이게 뭐야",
          likes: 166,
        },
        {
          id: 4,
          type: "갓생병",
          nickname: "애랑 살기 힘들다",
          content:
            "자꾸 갓생 살겠다고 새벽 5시에 알람 맞추는데 안 일어나 그냥 나만 억울하게 일찍 일어난 사람 됨",
          likes: 153,
        },
        {
          id: 5,
          type: "집병",
          nickname: "아집가고싶다",
          content: "집에 있어도 집 가고싶고 나가도 집 가고싶고",
          likes: 112,
        },
      ];

      function LikeButton({ count, onLike }) {
        const [pop, setPop] = useState(false);

        function handleClick() {
          onLike();
          setPop(true);
          setTimeout(() => setPop(false), 250);
        }

        return (
          <button
            onClick={handleClick}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              marginLeft: "auto",
              background: "transparent",
              border: `1px solid ${colors.line}`,
              borderRadius: 999,
              padding: "4px 11px",
              cursor: "pointer",
              color: colors.pinkSoft,
              fontFamily: fontMono,
              fontSize: 12.5,
              transition: "border-color 0.15s ease, color 0.15s ease",
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.borderColor = colors.pink;
              e.currentTarget.style.color = colors.pink;
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.borderColor = colors.line;
              e.currentTarget.style.color = colors.pinkSoft;
            }}
          >
            <span className={pop ? "like-pop" : ""} style={{ fontSize: 13 }}>
              ♥
            </span>
            <span>{count}</span>
          </button>
        );
      }

      function GossipBoard({ gossips, onLike }) {
        return (
          <section
            style={{
              flex: 1,
              display: "flex",
              flexDirection: "column",
              minHeight: 0,
              background: "#0d0d0d",
              borderRight: `1px solid ${colors.line}`,
            }}
          >
            <div
              style={{
                padding: "28px 30px 18px",
                borderBottom: `1px solid ${colors.line}`,
              }}
            >
              <h2
                style={{
                  fontFamily: fontSebang,
                  fontSize: 26,
                  fontWeight: 700,
                  color: colors.text,
                  margin: 0,
                }}
              >
                신규 신병 게시판
              </h2>
            </div>

            <div
              className="custom-scroll"
              style={{
                flex: 1,
                overflowY: "auto",
                padding: "18px 30px 30px",
                display: "flex",
                flexDirection: "column",
                gap: 14,
              }}
            >
              {gossips.length === 0 ? (
                <p style={{ color: colors.textMuted, fontFamily: fontNoto }}>
                  아직 접수된 신병이 없습니다. 오른쪽에서 첫 사례를 신고해
                  주세요.
                </p>
              ) : (
                gossips.map((g) => (
                  <article
                    key={g.id}
                    style={{
                      background: colors.panelAlt,
                      border: `1px solid ${colors.line}`,
                      borderRadius: 4,
                      borderLeft: `3px solid ${colors.pink}`,
                      padding: "16px 18px",
                    }}
                  >
                    <div
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        marginBottom: 8,
                      }}
                    >
                      <span
                        style={{
                          fontFamily: fontSebang,
                          fontSize: 13,
                          fontWeight: 400,
                          color: colors.bg,
                          background: colors.pink,
                          borderRadius: 3,
                          padding: "2px 9px",
                        }}
                      >
                        {g.type}
                      </span>
                      <span
                        style={{
                          fontFamily: fontSebang,
                          fontSize: 13,
                          fontWeight: 400,
                          color: colors.textMuted,
                        }}
                      >
                        {g.nickname}
                      </span>
                      <LikeButton
                        count={g.likes || 0}
                        onLike={() => onLike(g.id)}
                      />
                    </div>
                    <p
                      style={{
                        margin: 0,
                        fontFamily: fontNoto,
                        fontSize: 14.5,
                        lineHeight: 1.6,
                        color: colors.text,
                      }}
                    >
                      {g.content}
                    </p>
                  </article>
                ))
              )}
            </div>
          </section>
        );
      }

      function ReportForm({ onSubmit }) {
        const [nickname, setNickname] = useState("");
        const [diseaseName, setDiseaseName] = useState("");
        const [detail, setDetail] = useState("");
        const [justSubmitted, setJustSubmitted] = useState(false);

        const isValid = nickname.trim() && diseaseName.trim() && detail.trim();

        function handleSubmit(e) {
          e.preventDefault();
          if (!isValid) return;

          const newEntry = {
            id: Date.now(),
            type: diseaseName.trim(),
            nickname: nickname.trim(),
            content: detail.trim(),
            likes: 0,
          };

          onSubmit(newEntry);

          setNickname("");
          setDiseaseName("");
          setDetail("");
          setJustSubmitted(true);
          setTimeout(() => setJustSubmitted(false), 1800);
        }

        const inputStyle = {
          width: "100%",
          boxSizing: "border-box",
          background: colors.bg,
          border: `1px solid ${colors.line}`,
          borderRadius: 4,
          padding: "11px 13px",
          fontFamily: fontNoto,
          fontSize: 14,
          color: colors.text,
          outline: "none",
        };

        const labelStyle = {
          display: "block",
          fontFamily: fontSebang,
          fontSize: 12,
          fontWeight: 400,
          color: colors.textMuted,
          letterSpacing: 0.5,
          marginBottom: 6,
        };

        return (
          <section
            style={{
              flex: 1,
              display: "flex",
              flexDirection: "column",
              minHeight: 0,
              background: "#0d0d0d",
            }}
          >
            <div
              style={{
                padding: "28px 30px 18px",
                borderBottom: `1px solid ${colors.line}`,
              }}
            >
              <h2
                style={{
                  fontFamily: fontSebang,
                  fontSize: 26,
                  fontWeight: 700,
                  color: colors.text,
                  margin: 0,
                }}
              >
                신규 신병 신고 센터
              </h2>
            </div>

            <form
              onSubmit={handleSubmit}
              className="custom-scroll"
              style={{
                flex: 1,
                overflowY: "auto",
                padding: "24px 30px 30px",
                display: "flex",
                flexDirection: "column",
                gap: 18,
              }}
            >
              <div>
                <label style={labelStyle}>닉네임</label>
                <input
                  style={inputStyle}
                  type="text"
                  value={nickname}
                  onChange={(e) => setNickname(e.target.value)}
                  placeholder="예: 익명의 환자"
                  maxLength={20}
                />
              </div>

              <div>
                <label style={labelStyle}>신병 명칭</label>
                <input
                  style={inputStyle}
                  type="text"
                  value={diseaseName}
                  onChange={(e) => setDiseaseName(e.target.value)}
                  placeholder="예: 인스타병"
                  maxLength={20}
                />
              </div>

              <div
                style={{ flex: 1, display: "flex", flexDirection: "column" }}
              >
                <label style={labelStyle}>증상 상세 내용</label>
                <textarea
                  style={{
                    ...inputStyle,
                    flex: 1,
                    minHeight: 140,
                    resize: "none" /* 오른쪽 아래 핸들 제거 */,
                    lineHeight: 1.6,
                    fontFamily: fontNoto,
                  }}
                  value={detail}
                  onChange={(e) => setDetail(e.target.value)}
                  placeholder="어떤 증상을 겪고 계신가요? 솔직하게 작성해 주세요."
                  maxLength={300}
                />
              </div>

              <button
                type="submit"
                disabled={!isValid}
                style={{
                  marginTop: 4,
                  padding: "13px 0",
                  border: "none",
                  borderRadius: 4,
                  fontFamily: fontSebang,
                  fontSize: 15,
                  fontWeight: 700,
                  cursor: isValid ? "pointer" : "not-allowed",
                  background: isValid ? colors.pink : colors.pinkDim,
                  color: isValid ? colors.bg : colors.textMuted,
                  transition: "opacity 0.15s ease",
                }}
              >
                {justSubmitted ? "접수 완료" : "접수하기"}
              </button>
            </form>
          </section>
        );
      }

      const STORAGE_KEY = "sinbyung_gossips_v2";
      const OLD_STORAGE_KEY = "sinbyung_gossips";

      function loadGossips() {
        try {
          // 1) 새 저장소에 데이터가 있으면 그대로 사용 (접수한 병 + 좋아요 수 모두 포함)
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            return JSON.parse(saved).map((g) => ({ likes: 0, ...g }));
          }

          // 2) 예전 저장소에 접수된 병이 있으면 가져오기 (기본 5개는 새 좋아요 수로 대체)
          const old = localStorage.getItem(OLD_STORAGE_KEY);
          if (old) {
            const userEntries = JSON.parse(old)
              .filter((g) => !initialGossips.some((i) => i.id === g.id))
              .map((g) => ({ likes: 0, ...g }));
            return [...userEntries, ...initialGossips];
          }
        } catch (e) {
          console.error("데이터 불러오기 실패", e);
        }
        return initialGossips;
      }

      function CafeteriaPage() {
        const [gossips, setGossips] = useState(loadGossips);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(gossips));
          } catch (e) {
            console.error("데이터 저장 실패", e);
          }
        }, [gossips]);

        // 이하 handleAddGossip, handleLike, return(...) 는 기존 그대로

        function handleAddGossip(entry) {
          setGossips((prev) => [entry, ...prev]);
        }

        function handleLike(id) {
          setGossips((prev) =>
            prev.map((g) =>
              g.id === id ? { ...g, likes: (g.likes || 0) + 1 } : g,
            ),
          );
        }

        return (
          <div
            style={{
              height: "100vh",
              width: "100%",
              display: "flex",
              padding: "75px 90px 60px 90px",
              background: "transparent",
              fontFamily: fontSebang,
              gap: "24px",
            }}
          >
            <div
              style={{
                display: "flex",
                width: "100%",
                height: "100%",
                border: `1px solid ${colors.line}`,
                borderRadius: "8px",
                overflow: "hidden",
              }}
            >
              <GossipBoard gossips={gossips} onLike={handleLike} />
              <ReportForm onSubmit={handleAddGossip} />
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<CafeteriaPage />);
    </script>
  </body>

  <div class="cursor" aria-hidden="true">
    <div class="cursor-inner">
      <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <path
          fill="#fff"
          fill-opacity="0.3"
          fill-rule="evenodd"
          d="M50,4 L94,100 L50,74 L6,100 Z M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z"
        />
        <path
          fill="#fff"
          fill-opacity="0.6"
          fill-rule="evenodd"
          d="M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z"
        />
        <path fill="#fff" d="M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z" />
      </svg>
    </div>
  </div>

  <style>
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cursor-ready .cursor {
      opacity: 1;
    }

    .cursor-inner {
      position: absolute;
      left: -19px;
      top: -3px;
      width: 38px;
      height: 42px;
      transform: rotate(-30deg);
      transform-origin: 50% 8%;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.55))
        drop-shadow(0 0 14px rgba(255, 255, 255, 0.3));
      transition:
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.3s ease;
    }

    .cursor-inner svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cursor-hover .cursor-inner,
    .cursor-scan .cursor-inner {
      transform: rotate(-30deg) scale(0.55);
      filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.75))
        drop-shadow(0 0 20px rgba(255, 255, 255, 0.45));
    }

    .cursor-down .cursor-inner {
      transform: rotate(-30deg) scale(0.85);
    }

    html.has-custom-cursor,
    html.has-custom-cursor * {
      cursor: none !important;
    }
  </style>

  <script>
    (function () {
      const finePointer = window.matchMedia(
        "(hover: hover) and (pointer: fine)",
      ).matches;
      if (!finePointer) return;

      const root = document.documentElement;
      const cursor = document.querySelector(".cursor");
      root.classList.add("has-custom-cursor");

      window.addEventListener("mousemove", (e) => {
        cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        root.classList.add("cursor-ready");
      });

      document.addEventListener("mouseover", (e) => {
        const t = e.target;
        root.classList.remove("cursor-hover", "cursor-scan");
        if (t.closest("[data-cursor='scan']")) {
          root.classList.add("cursor-scan");
        } else if (t.closest("a, button, [data-cursor]")) {
          root.classList.add("cursor-hover");
        }
      });

      window.addEventListener("mousedown", () =>
        root.classList.add("cursor-down"),
      );
      window.addEventListener("mouseup", () =>
        root.classList.remove("cursor-down"),
      );
      document.addEventListener("mouseleave", () =>
        root.classList.remove("cursor-ready"),
      );
      document.addEventListener("mouseenter", () =>
        root.classList.add("cursor-ready"),
      );
    })();
  </script>
</html>

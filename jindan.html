<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 병 진단 테스트</title>

    <!-- 반응형 배율 계산 (1536 x 960 기준) : 렌더링 전에 먼저 실행 -->
    <script>
      (function () {
        var DESIGN_W = 1536;
        var DESIGN_H = 960;
        function fit() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          var s = 1;
          if (w >= 900) {
            s = Math.min(w / DESIGN_W, h / DESIGN_H);
            s = Math.max(0.6, s);
          }
          document.documentElement.style.setProperty("--s", s);
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "SEBANG Gothic Bold";
        src: url("SEBANG Gothic OTF Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }

      strong,
      b,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      .kicker,
      .result-kicker,
      .result-subtitle,
      .btn-primary,
      .btn-ghost,
      .nav-btn {
        font-family:
          "SEBANG Gothic Bold", "Pretendard Variable", Pretendard, sans-serif !important;
        font-weight: 700 !important;
      }

      /* --s : 화면 배율 (JS가 갱신), --u : 배율이 적용된 1px */
      :root {
        --s: 1;
        --u: calc(1px * var(--s));
        --ink: #08070a;
        --pink: #ff008c;
        --pink-dim: #b5124f;
        --paper: #f3eef0;
        --mute: #857e82;
        --line: rgba(255, 255, 255, 0.1);
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        position: fixed;
        inset: 0;
        width: 100%;
        background: var(--ink);
        color: var(--paper);

        font-family: "Pretendard Variable", Pretendard, Arial, sans-serif;

        background-color: #000000;
        background-image:
          linear-gradient(rgba(255, 133, 218, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 133, 218, 0.12) 1px, transparent 1px);
        background-size: calc(50 * var(--u)) calc(50 * var(--u));
      }

      /* =========================================================
         로고 / 브랜딩
      ========================================================= */

      #left-branding {
        position: absolute;
        top: calc(30 * var(--u));
        left: calc(90 * var(--u));
        width: calc(650 * var(--u));
        z-index: 2000;
        pointer-events: none;
      }

      .logo-link {
        display: inline-block;
        pointer-events: auto;
        width: calc(130 * var(--u));
        margin-bottom: calc(10 * var(--u));
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .logo-img {
        height: auto;
        width: 115%;
        display: block;
        opacity: 0.6;
        transition: opacity 0.2s;
      }

      .logo-link:hover .logo-img {
        opacity: 1;
      }

      /* =========================================================
         상단 진행률 바
      ========================================================= */

      .progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;

        height: calc(3 * var(--u));

        background: rgba(255, 255, 255, 0.06);

        z-index: 10;
      }

      .progress-fill {
        height: 100%;
        width: 0%;

        background: var(--pink);

        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* =========================================================
         공통 레이아웃
      ========================================================= */

      .app {
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: calc(24 * var(--u));
      }

      .panel {
        width: 100%;
        max-width: calc(580 * var(--u));

        border: calc(2 * var(--u)) solid #000000;
        background: rgba(0, 0, 0, 0.45);
        box-shadow: 0 calc(24 * var(--u)) calc(60 * var(--u))
          rgba(0, 0, 0, 0.55);

        padding: calc(44 * var(--u)) calc(46 * var(--u));
        position: relative;
      }

      .screen {
        display: none;
      }

      .screen.is-active {
        display: block;

        animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(calc(12 * var(--u)));
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .screen.is-active {
          animation: none;
        }
      }

      /* =========================================================
         인트로
      ========================================================= */

      .kicker {
        color: var(--pink);

        font-size: calc(14 * var(--u));
        font-weight: 600;

        margin-bottom: calc(18 * var(--u));
      }

      .intro-title {
        font-size: clamp(
          calc(34 * var(--u)),
          calc(6.6 * var(--u) * 15.36),
          calc(56 * var(--u))
        );
        font-weight: 800;

        line-height: 1.1;
        letter-spacing: -0.03em;

        margin-bottom: calc(22 * var(--u));
      }

      .intro-desc {
        max-width: calc(460 * var(--u));

        color: var(--mute);

        font-size: calc(16 * var(--u));
        line-height: 1.7;

        margin-bottom: calc(12 * var(--u));
      }

      .intro-meta {
        color: var(--mute);

        font-size: calc(14 * var(--u));

        margin-bottom: calc(44 * var(--u));
      }

      .btn-primary {
        appearance: none;
        border: none;

        padding: calc(16 * var(--u)) calc(40 * var(--u));

        background: var(--pink);
        color: #08070a;

        font-family: inherit;
        font-size: calc(16 * var(--u));
        font-weight: 700;

        cursor: pointer;

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn-primary:hover {
        box-shadow: 0 calc(16 * var(--u)) calc(36 * var(--u))
          rgba(255, 46, 122, 0.35);
        transform: translateY(calc(-2 * var(--u)));
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      /* =========================================================
         질문 화면
      ========================================================= */

      .q-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: calc(18 * var(--u));
      }

      .q-count {
        color: var(--mute);

        font-size: calc(13 * var(--u));
        font-weight: 600;
      }

      .q-count b {
        color: var(--pink);
        font-weight: 700;
      }

      .q-toolbar-actions {
        display: flex;
        gap: calc(8 * var(--u));
      }

      .nav-btn {
        appearance: none;

        padding: calc(8 * var(--u)) calc(14 * var(--u));

        background: none;
        border: 1px solid var(--line);
        color: var(--mute);

        font-family: inherit;
        font-size: calc(12 * var(--u));
        font-weight: 600;

        cursor: pointer;

        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .nav-btn:hover {
        border-color: var(--pink);
        color: var(--pink);
      }

      .nav-btn[disabled] {
        visibility: hidden;
      }

      .q-title {
        font-size: clamp(
          calc(23 * var(--u)),
          calc(4.2 * var(--u) * 15.36),
          calc(32 * var(--u))
        );
        font-weight: 800;

        line-height: 1.32;
        letter-spacing: -0.02em;

        margin-bottom: calc(34 * var(--u));
      }

      .options {
        display: flex;
        flex-direction: column;

        border-top: 1px solid var(--line);
      }

      .option {
        position: relative;

        display: flex;
        align-items: center;

        padding: calc(18 * var(--u)) calc(4 * var(--u)) calc(18 * var(--u))
          calc(20 * var(--u));

        border-bottom: 1px solid var(--line);

        background: none;
        border-left: none;
        border-right: none;

        color: var(--paper);

        font-family: inherit;
        font-size: calc(16 * var(--u));
        font-weight: 500;

        text-align: left;

        cursor: pointer;

        transition:
          padding-left 0.2s ease,
          color 0.2s ease;
      }

      .option::before {
        content: "";

        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;

        width: calc(3 * var(--u));

        background: var(--pink);

        transform: scaleY(0);
        transform-origin: bottom;

        transition: transform 0.25s ease;
      }

      .option:hover {
        padding-left: calc(32 * var(--u));
        color: var(--pink);
      }

      .option:hover::before {
        transform: scaleY(1);
      }

      .option.is-picked {
        color: var(--pink);
        padding-left: calc(32 * var(--u));
      }

      .option.is-picked::before {
        transform: scaleY(1);
      }

      /* =========================================================
         결과 화면
      ========================================================= */

      .result-kicker {
        color: var(--mute);

        font-size: calc(14 * var(--u));
        font-weight: 600;

        margin-bottom: calc(14 * var(--u));
      }

      .result-subtitle {
        color: var(--pink);

        font-size: calc(14 * var(--u));
        font-weight: 700;

        text-align: left;

        margin-bottom: calc(8 * var(--u));
      }

      .result-title {
        font-size: clamp(
          calc(32 * var(--u)),
          calc(6 * var(--u) * 15.36),
          calc(50 * var(--u))
        );
        font-weight: 800;

        line-height: 1.12;
        letter-spacing: -0.03em;

        margin-bottom: calc(22 * var(--u));
      }

      .result-desc {
        max-width: calc(470 * var(--u));

        color: var(--mute);

        font-size: calc(16 * var(--u));
        line-height: 1.75;

        margin-bottom: calc(20 * var(--u));
      }

      .result-secondary {
        max-width: calc(470 * var(--u));

        padding: calc(16 * var(--u)) calc(18 * var(--u));

        border: 1px solid var(--line);

        color: var(--mute);

        font-size: calc(14 * var(--u));
        line-height: 1.65;

        margin-bottom: calc(40 * var(--u));
      }

      /* 병명(b) 글자가 아래로 치우쳐 보이는 문제 보정 */
      .result-secondary b {
        display: inline-block;
        position: relative;
        top: -1px;

        color: var(--paper);
        font-weight: 700;
      }

      .result-actions {
        display: flex;
        gap: calc(12 * var(--u));
      }

      .btn-ghost {
        appearance: none;

        padding: calc(15 * var(--u)) calc(30 * var(--u));

        background: none;
        border: 1px solid var(--line);
        color: var(--paper);

        font-family: inherit;
        font-size: calc(15 * var(--u));
        font-weight: 600;

        cursor: pointer;

        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .btn-ghost:hover {
        border-color: var(--pink);
        color: var(--pink);
      }
    </style>
  </head>

  <body>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="left-branding">
      <button class="logo-link" onclick="window.location.href = 'index.html'">
        <img src="logo04.png" alt="신병 연구소 로고" class="logo-img" />
      </button>
    </div>

    <div class="app">
      <div class="panel">
        <!-- =========================
             1. 인트로
        ========================== -->
        <section class="screen is-active" id="screen-intro">
          <p class="kicker">SELF TEST</p>

          <h1 class="intro-title">나는 지금<br />무슨 병에 걸렸을까?</h1>

          <p class="intro-desc">
            질문 10개에 솔직하게 답하면, 요즘 나에게 가장 가까운 증상을
            찾아드려요. 정답은 없으니 편하게 골라보세요.
          </p>

          <p class="intro-meta">문항 10개 · 약 1분 소요</p>

          <button class="btn-primary" id="startBtn" type="button">
            테스트 시작
          </button>
        </section>

        <!-- =========================
             2. 질문 (JS로 렌더링)
        ========================== -->
        <section class="screen" id="screen-question">
          <div class="q-toolbar">
            <p class="q-count">
              <b id="qIndex">1</b> / <span id="qTotal">10</span>
            </p>

            <div class="q-toolbar-actions">
              <button class="nav-btn" id="prevBtn" type="button">이전</button>
              <button class="nav-btn" id="restartBtnTop" type="button">
                처음부터
              </button>
            </div>
          </div>

          <h2 class="q-title" id="qTitle"></h2>

          <div class="options" id="qOptions"></div>
        </section>

        <!-- =========================
             3. 결과
        ========================== -->
        <section class="screen" id="screen-result">
          <p class="result-kicker">결과</p>
          <p class="result-subtitle" id="resultSubtitle"></p>

          <h2 class="result-title" id="resultTitle"></h2>

          <p class="result-desc" id="resultDesc"></p>

          <div class="result-secondary" id="resultSecondary"></div>

          <div class="result-actions">
            <button class="btn-primary" id="retryBtn" type="button">
              다시 하기
            </button>
          </div>
        </section>
      </div>
    </div>

    <!-- 커스텀 마우스 커서 -->
    <div class="cursor" aria-hidden="true">
      <div class="cursor-inner">
        <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
          <!-- 바깥 30% -->
          <path
            fill="#fff"
            fill-opacity="0.3"
            fill-rule="evenodd"
            d="M50,4 L94,100 L50,74 L6,100 Z M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z"
          />
          <!-- 중간 60% -->
          <path
            fill="#fff"
            fill-opacity="0.6"
            fill-rule="evenodd"
            d="M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z"
          />
          <!-- 중심 100% -->
          <path fill="#fff" d="M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z" />
        </svg>
      </div>
    </div>

    <style>
      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .cursor-ready .cursor {
        opacity: 1;
      }

      .cursor-inner {
        position: absolute;
        left: calc(-19 * var(--u));
        top: calc(-3 * var(--u));
        width: calc(38 * var(--u));
        height: calc(42 * var(--u));

        /* 기본 기울기 -30도 */
        transform: rotate(-30deg);

        transform-origin: 50% 8%;
        filter: drop-shadow(0 0 calc(5 * var(--u)) rgba(255, 255, 255, 0.55))
          drop-shadow(0 0 calc(14 * var(--u)) rgba(255, 255, 255, 0.3));
        transition:
          transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.3s ease;
      }

      .cursor-inner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .cursor-hover .cursor-inner,
      .cursor-scan .cursor-inner {
        /* 호버 시 -30도 유지 + 작아짐 */
        transform: rotate(-30deg) scale(0.55);

        filter: drop-shadow(0 0 calc(7 * var(--u)) rgba(255, 255, 255, 0.75))
          drop-shadow(0 0 calc(20 * var(--u)) rgba(255, 255, 255, 0.45));
      }

      .cursor-down .cursor-inner {
        /* 클릭 시 -30도 유지 + 작아짐 */
        transform: rotate(-30deg) scale(0.85);
      }

      html.has-custom-cursor,
      html.has-custom-cursor * {
        cursor: none !important;
      }
    </style>

    <script>
      /* =====================================================
         증상 데이터
         (사용자가 제공한 12가지 병을 축약/재구성)
      ===================================================== */

      const SYNDROMES = {
        H: {
          title: "홍대병",
          subtitle: "비주류 선호성 과잉 증후군",
          desc: "남들이 아직 모르는 걸 먼저 알아보는 데서 안정감을 느끼는 타입이에요. 좋아하던 게 유명해지는 순간, 이상하게 서운하고 배신당한 기분이 든다면 이미 진행 중일 가능성이 커요.",
        },
        G: {
          title: "칭기즈칸병",
          subtitle: "자기중심적 가치 동기화 강박",
          desc: "내가 좋다고 느낀 건 남도 반드시 좋아해야 마음이 놓이는 타입이에요. 권유가 거절당하면 그 사람과는 취향이 안 맞는 게 아니라 '대화가 안 통한다'고 느끼기 쉬워요.",
        },
        K: {
          title: "강남병",
          subtitle: "상업적 성과 기반 취향 정당화 증후군",
          desc: "숫자와 순위가 곧 정답이라고 믿는 타입이에요. 검증되지 않은 선택은 실패처럼 느껴져서, 뭘 고르기 전에 후기와 랭킹부터 확인해야 마음이 놓여요.",
        },
        J: {
          title: "중안부정병",
          subtitle: "안면 중앙부 비율 집착성 신체 변형 장애",
          desc: "사진 한 장에도 각도와 비율을 먼저 따지는 타입이에요. 무보정 사진 속 내 얼굴을 보면 남들보다 스스로에게 유독 박한 평가를 내리곤 해요.",
        },
        P: {
          title: "뻐큐정병",
          subtitle: "지절 비율 왜곡 인식 기반 표현 기피 장애",
          desc: "감정을 표현하는 방식 하나에도 스스로 만족스러운 '각'을 따지는 타입이에요. 정작 중요한 순간엔 스스로를 검열하느라 하고 싶은 말을 다 못 하고 넘어가곤 해요.",
        },
        C: {
          title: "연예인병",
          subtitle: "자기중심적 인지도 과대평가 및 시선 의식 증후군",
          desc: "남들의 시선을 유독 의식하는 타입이에요. 아무도 신경 쓰지 않는 상황에서도 괜히 모자와 마스크를 챙기고, 평범한 관심에도 크게 의미를 부여해요.",
        },
        D: {
          title: "GD병",
          subtitle: "특정 아이콘 기반 정체성 동화 장애",
          desc: "동경하는 스타일을 자연스럽게 따라가는 타입이에요. 걸음걸이, 옷차림 하나에도 좋아하는 아이콘의 흔적이 은근히 묻어나요.",
        },
        N: {
          title: "일본 하늘 차원달라병",
          subtitle: "특정 기상 현상 기반 투사적 미화 장애",
          desc: '여행지의 사소한 것 하나까지 미화하는 타입이에요. 하늘빛 하나에도 "여기랑 차원이 다르다"는 말이 자연스럽게 나와요.',
        },
        F: {
          title: "과일차원달라병",
          subtitle: "가성비·당도 기반 비교 강박 장애",
          desc: "맛과 가성비의 기준이 특정 경험에 완전히 고정된 타입이에요. 그 이후로는 뭘 먹어도 그때 그 맛과 가격이 자꾸 비교 대상이 돼요.",
        },
        I: {
          title: "인스타병",
          subtitle: "전시적 일상 기록 및 디지털 승인 욕구 장애",
          desc: "경험보다 기록이 먼저인 타입이에요. 게시물 반응이 좋을 때 비로소 그날 하루가 완성된 느낌을 받는다면 이미 진행 중이에요.",
        },

      /* =====================================================
     랜덤 유틸
  ===================================================== */

      // Fisher–Yates 셔플 (원본은 건드리지 않고 복사본 반환)
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // 한 번의 테스트 동안 유지될 "덱"을 만든다.
      // 전체 문항을 섞은 뒤 앞에서 QUESTION_COUNT개만 뽑고,
      // 각 문항의 선택지 순서도 섞는다.
      // '이전' 버튼으로 돌아와도 같은 순서가 보이도록 덱에 고정해둔다.
      function buildDeck() {
        return shuffle(QUESTIONS)
          .slice(0, QUESTION_COUNT)
          .map((q) => ({
            title: q.title,
            options: shuffle(q.options),
          }));
      }

      /* =====================================================
     상태

     deck       = 이번 회차의 (섞인) 문항 배열
     answers[i] = deck[i]에서 고른 선택지 index (안 골랐으면 null)
  ===================================================== */

      let deck = buildDeck();
      let current = 0;
      let answers = new Array(deck.length).fill(null);

      const screens = {
        intro: document.getElementById("screen-intro"),
        question: document.getElementById("screen-question"),
        result: document.getElementById("screen-result"),
      };

      const progressFill = document.getElementById("progressFill");
      const prevBtn = document.getElementById("prevBtn");

      function showScreen(name) {
        Object.values(screens).forEach((s) => s.classList.remove("is-active"));
        screens[name].classList.add("is-active");
      }

      function newRun() {
        deck = buildDeck();
        current = 0;
        answers = new Array(deck.length).fill(null);
      }

      function renderQuestion() {
        const q = deck[current];

        document.getElementById("qIndex").textContent = current + 1;
        document.getElementById("qTotal").textContent = deck.length;
        document.getElementById("qTitle").textContent = q.title;

        progressFill.style.width = `${(current / deck.length) * 100}%`;

        prevBtn.disabled = current === 0;

        const optionsEl = document.getElementById("qOptions");
        optionsEl.innerHTML = "";

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.type = "button";
          btn.textContent = opt.text;

          if (answers[current] === i) {
            btn.classList.add("is-picked");
          }

          btn.addEventListener("click", () => {
            answers[current] = i;

            optionsEl
              .querySelectorAll(".option")
              .forEach((el) => el.classList.remove("is-picked"));
            btn.classList.add("is-picked");

            setTimeout(() => {
              if (current < deck.length - 1) {
                current += 1;
                renderQuestion();
              } else {
                showResult();
              }
            }, 200);
          });

          optionsEl.appendChild(btn);
        });
      }

      function computeScores() {
        const scores = {};
        const firstSeen = {}; // 동점일 때 먼저 선택된 쪽을 앞세우기 위한 기록

        Object.keys(SYNDROMES).forEach((key) => {
          scores[key] = 0;
        });

        answers.forEach((optIndex, qIndex) => {
          if (optIndex === null) return;

          const tag = deck[qIndex].options[optIndex].tag;
          scores[tag] += 1;
          if (!(tag in firstSeen)) firstSeen[tag] = qIndex;
        });

        return { scores, firstSeen };
      }

      function showResult() {
        progressFill.style.width = "100%";

        const { scores, firstSeen } = computeScores();

        // 점수 내림차순, 동점이면 먼저 고른 쪽이 앞
        const ranked = Object.entries(scores)
          .filter(([, v]) => v > 0)
          .sort((a, b) => b[1] - a[1] || firstSeen[a[0]] - firstSeen[b[0]]);

        const topKey = ranked.length ? ranked[0][0] : "M";
        const secondEntry = ranked.find(([key]) => key !== topKey);

        const top = SYNDROMES[topKey];

        document.getElementById("resultSubtitle").textContent = top.subtitle;
        document.getElementById("resultTitle").textContent = top.title;
        document.getElementById("resultDesc").textContent = top.desc;

        const secondaryEl = document.getElementById("resultSecondary");

        if (secondEntry) {
          const second = SYNDROMES[secondEntry[0]];

          if (topKey === "X") {
            secondaryEl.innerHTML = `다만 <b>${second.title}</b> 성향도 살짝 섞여 있어요.`;
          } else if (secondEntry[0] === "X") {
            secondaryEl.innerHTML = `그 와중에 비교적 <b>평범한(비환자) 모습</b>도 함께 보여요.`;
          } else {
            secondaryEl.innerHTML = `동반 증상으로 <b>${second.title}</b> 성향도 함께 보여요.`;
          }

          secondaryEl.style.display = "block";
        } else {
          secondaryEl.style.display = "none";
        }

        showScreen("result");
      }

      function restart() {
        newRun();
        progressFill.style.width = "0%";
        showScreen("intro");
      }

      document.getElementById("startBtn").addEventListener("click", () => {
        newRun(); // 시작할 때마다 새로 섞기

        showScreen("question");
        renderQuestion();
      });

      prevBtn.addEventListener("click", () => {
        if (current === 0) return;
        current -= 1;
        renderQuestion();
      });

      document
        .getElementById("restartBtnTop")
        .addEventListener("click", restart);
      document.getElementById("retryBtn").addEventListener("click", restart);
    </script>

    <script>
      (function () {
        const finePointer = window.matchMedia(
          "(hover: hover) and (pointer: fine)",
        ).matches;
        if (!finePointer) return;

        const root = document.documentElement;
        const cursor = document.querySelector(".cursor");
        root.classList.add("has-custom-cursor");

        window.addEventListener("mousemove", (e) => {
          cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
          root.classList.add("cursor-ready");
        });

        document.addEventListener("mouseover", (e) => {
          const t = e.target;
          root.classList.remove("cursor-hover", "cursor-scan");
          if (t.closest("[data-cursor='scan']")) {
            root.classList.add("cursor-scan");
          } else if (t.closest("a, button, [data-cursor]")) {
            root.classList.add("cursor-hover");
          }
        });

        window.addEventListener("mousedown", () =>
          root.classList.add("cursor-down"),
        );
        window.addEventListener("mouseup", () =>
          root.classList.remove("cursor-down"),
        );
        document.addEventListener("mouseleave", () =>
          root.classList.remove("cursor-ready"),
        );
        document.addEventListener("mouseenter", () =>
          root.classList.add("cursor-ready"),
        );
      })();
    </script>

    <!-- 반응형 배율 계산 (1536 x 960 기준) : 렌더링 전에 먼저 실행 -->
    <script>
      (function () {
        var DESIGN_W = 1536;
        var DESIGN_H = 960;
        window.__stageScale = 1;
        function fit() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          var s = 1;
          if (w >= 900) {
            s = Math.min(w / DESIGN_W, h / DESIGN_H);
            s = Math.max(0.6, s);
          }
          window.__stageScale = s;
          document.documentElement.style.setProperty("--s", s);
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>

    <style>
      /* ===== 시작 가이드 팝업 ===== */
      #idle-guide-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.95);
        background: rgba(10, 10, 15, 0.85);
        border: 1px solid rgba(255, 46, 122, 0.4);
        box-shadow: 0 0 30px rgba(255, 46, 122, 0.2);
        padding: calc(24 * var(--u)) calc(36 * var(--u));
        z-index: 9999;
        text-align: center;
        color: #ff008c;
        /* 폰트: SEBANG Gothic (없을 경우 순서대로 대체) */
        font-family:
          "SebangGothic", "SebangGothic-Bold", "Chakra Petch", sans-serif;
        font-size: calc(20 * var(--u));
        letter-spacing: 0.5px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        /* 기본 사라짐 = 2초 뒤 천천히 스르르 (1.2초에 걸쳐 사라짐) */
        transition:
          opacity 1.2s ease,
          transform 1.2s ease,
          visibility 1.2s ease;
        backdrop-filter: blur(8px);
      }
      #idle-guide-popup.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1);
        /* 나타날 때는 조금 빠르게 */
        transition:
          opacity 0.6s ease,
          transform 0.6s ease,
          visibility 0.6s ease;
      }
      #idle-guide-popup.fast {
        /* 휠/드래그 반응이 왔을 때 = 스르륵! 빠르게 사라짐 (0.35초) */
        transition:
          opacity 0.35s ease,
          transform 0.35s ease,
          visibility 0.35s ease;
      }
    </style>

        setInfectionDots(0); // 전염성 전부 빈 점
      }
      resetInfo();

      // 콜론(:) 앞의 고유 명칭을 헤더로, 뒤를 본문으로 분리.
      // 콜론이 없거나 앞부분이 너무 길면(라벨로 부적합) 기본값(초기/중기/말기) 사용.
      function parseStage(text, fallbackLabel) {
        if (!text) return { label: fallbackLabel, desc: "" };
        const idx = text.indexOf(":");
        if (idx > -1 && idx <= 20) {
          return {
            label: text.slice(0, idx).trim(),
            desc: text.slice(idx + 1).trim(),
          };
        }
        return { label: fallbackLabel, desc: text };
      }

      for (let i = 0; i < num; i++) {
        const wrapper = document.createElement("div");
        wrapper.className = "panel-wrapper";
        const filename = imgs[i % imgs.length];
        const imgUrl = `url('${filename}')`;

        wrapper.onmouseenter = () => {
          const data = contentData[filename];
          if (data) {
            document.getElementById("info-title").innerText = data.header.title;
            document.getElementById("info-desc").innerText = data.header.desc;
            document.getElementById("info-code").innerText = data.header.code;
            setInfectionDots(data.header.infectionLevel);
          }
        };
        wrapper.onmouseleave = resetInfo;

        wrapper.onclick = () => {
          currentFilename =
            imgs.includes(filename) && contentData[filename]
              ? filename
              : "hongdae.webp";
          currentTab = "overview";

          document.querySelectorAll(".popup-nav-tab").forEach((tab, idx) => {
            if (idx === 0) tab.classList.add("active");
            else tab.classList.remove("active");
          });

          updatePopupContent();
          popup.classList.add("active");
        };

        const p = document.createElement("div");
        p.className = "panel";
        p.style.setProperty("--bg-image", imgUrl);
        wrapper.appendChild(p);
        stack.appendChild(wrapper);
        panels.push({ wrapper, p });
      }

      function updatePopupContent() {
        const data =
          contentData[currentFilename] || contentData["hongdae.webp"];
        const dynamicContainer = document.getElementById(
          "popup-dynamic-container",
        );
        dynamicContainer.innerHTML = "";

        if (currentTab === "overview") {
          dynamicContainer.innerHTML = `
            <div class="popup-content-layout">
              <img id="popup-card-image" class="popup-card-img" src="${currentFilename}" alt="Card Image" />
              <div class="popup-right-content">
                <div class="popup-title-area">
                  <h2 class="popup-main-title" id="popup-main-title">${data.header.title}</h2>
                  <p class="popup-sub-title" id="popup-sub-title">${data.subtitle}</p>
                </div>
                <div class="popup-content-box" id="popup-tab-content"></div>
              </div>
            </div>
          `;

          const contentBox = document.getElementById("popup-tab-content");
          data.sections.forEach((sec) => {
            const row = document.createElement("div");
            row.className = "popup-row";

            const badge = document.createElement("div");
            badge.className = "popup-tag-badge";
            badge.innerText = sec.label;

            const val = document.createElement("div");
            val.className = "popup-text-val";
            val.innerText = sec.text;

            row.appendChild(badge);
            row.appendChild(val);
            contentBox.appendChild(row);
          });
        } else if (currentTab === "symptom") {
          // 원인 카드: cause.items 가 있으면 그 라벨을 쓰고, 없으면 기본 3종(사회/환경/심리)
          const causeItems = data.cause.items || [
            { label: "사회적 요인", text: data.cause.social },
            { label: "환경적 요인", text: data.cause.environment },
            { label: "심리적 요인", text: data.cause.psychology },
          ];
          const causeHtml = causeItems
            .map(
              (c) => `
                    <div class="symptom-pink-card">
                      <h4 class="symptom-card-title">${c.label}</h4>
                      <p class="symptom-card-desc">${c.text}</p>
                    </div>`,
            )
            .join("");

          const early = parseStage(data.cause.stageEarly, "초기");
          const mid = parseStage(data.cause.stageMid, "중기");
          const end = parseStage(data.cause.stageEnd, "말기");

          dynamicContainer.innerHTML = `
            <div class="popup-right-content" style="padding-right: calc(40 * var(--u));">
              <div class="popup-title-area" style="margin-bottom: calc(20 * var(--u));">
                <h2 class="popup-main-title">${data.header.title}</h2>
                <p class="popup-sub-title">${data.subtitle}</p>
              </div>
              <div class="symptom-layout">
                <div class="symptom-section-row">
                  <div class="symptom-section-badge">원인</div>
                  <div class="symptom-cards-container">
                    ${causeHtml}
                  </div>
                </div>
                <div class="symptom-section-row">
                  <div class="symptom-section-badge">증상</div>
                  <div class="symptom-stages-container">
                    <div class="symptom-stage-item">
                      <div class="symptom-stage-header">${early.label}</div>
                      <p class="symptom-stage-desc">${early.desc}</p>
                    </div>
                    <div class="symptom-stage-item">
                      <div class="symptom-stage-header">${mid.label}</div>
                      <p class="symptom-stage-desc">${mid.desc}</p>
                    </div>
                    <div class="symptom-stage-item">
                      <div class="symptom-stage-header">${end.label}</div>
                      <p class="symptom-stage-desc">${end.desc}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else if (currentTab === "prescription") {
          let peopleHtml = "";
          const level = data.header.infectionLevel;
          for (let i = 1; i <= 5; i++) {
            if (i <= level) {
              peopleHtml += `<img src="hito-05.png" class="person-icon" alt="색칠된 사람">`;
            } else {
              peopleHtml += `<img src="hito-06.png" class="person-icon" alt="빈 사람">`;
            }
          }

          dynamicContainer.innerHTML = `
            <div class="popup-right-content" style="padding-right: calc(40 * var(--u));">
              <div class="popup-title-area" style="margin-bottom: calc(20 * var(--u));">
                <h2 class="popup-main-title">${data.header.title}</h2>
                <p class="popup-sub-title">${data.subtitle}</p>
              </div>
              <div class="prescription-layout">
                <div class="prescription-column" style="flex: 0.85;">
                  <div class="prescription-badge-center">
                    <div class="prescription-badge">확산 양상</div>
                  </div>
                  <div class="prescription-row-item">
                    <div class="prescription-sub-badge">전염성</div>
                    <div class="prescription-people-group">
                      ${peopleHtml}
                    </div>
                  </div>
                  <div class="prescription-row-item">
                    <div class="prescription-sub-badge">특이사항</div>
                    <div class="prescription-content-group">
                      <p class="symptom-stage-desc" style="line-height: 1.5;">
                        ${data.prescriptionData.special}
                      </p>
                    </div>
                  </div>
                </div>

                <div class="prescription-divider"></div>

                <div class="prescription-column" style="flex: 1.15;">
                  <div class="prescription-badge-center">
                    <div class="prescription-badge">처방</div>
                  </div>
                  <div class="prescription-row-item">
                    <div class="prescription-sub-badge">처방안 A</div>
                    <div class="prescription-content-group">
                      <p class="symptom-stage-desc" style="line-height: 1.4;">
                        ${data.prescriptionData.habit}
                      </p>
                    </div>
                  </div>
                  <div class="prescription-row-item">
                    <div class="prescription-sub-badge">처방안 B</div>
                    <div class="prescription-content-group">
                      <p class="symptom-stage-desc" style="line-height: 1.4;">
                        ${data.prescriptionData.journal}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }

      function switchTab(tabName, element) {
        currentTab = tabName;
        document.querySelectorAll(".popup-nav-tab").forEach((tab) => {
          tab.classList.remove("active");
        });
        element.classList.add("active");
        updatePopupContent();
      }

      function closePopup() {
        popup.classList.remove("active");
      }

      function render() {
        const popupOpen = popup.classList.contains("active");

        // 화면 배율 (head 스크립트가 갱신) - 카드 간격을 화면 크기에 맞춰 키움
        const S = window.__stageScale || 1;

        // 자동 스크롤: 상세 팝업이 열려 있을 때만 멈추고, 휠을 써도 멈추지 않음
        if (!popupOpen) {
          target += AUTO_SPEED;
        }
        // 자동/휠 이동 모두 부드럽게 따라가도록 보간
        current += (target - current) * 0.12;

        panels.forEach(({ wrapper, p }, i) => {
          let pos = (((i - current) % num) + num) % num;
          if (pos > num / 2) pos -= num;
          let opacity = Math.max(0, 1 - Math.max(0, Math.abs(pos) - 3.5) / 5);
          let x = pos * 150 * 0.6 * S;
          let z = pos * -80 * 0.6 * S;
          let y = z * 0.45;
          wrapper.style.transition = "none"; // JS 보간을 쓰므로 CSS transition 제거
          wrapper.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(-25deg)`;
          wrapper.style.opacity = opacity;
          p.style.zIndex = Math.round(100 - Math.abs(pos));
        });
        requestAnimationFrame(render);
      }

      // 휠: 한 칸씩 이동 (자동 스크롤은 멈추지 않고 계속 진행)
      window.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault(); // 브라우저 기본 스크롤 차단
          target = Math.round(target) + (e.deltaY > 0 ? 1 : -1);
        },
        { passive: false },
      );
      render();

      // ===== 시작 가이드 팝업 =====
      // 1) 페이지에 들어오면 나타나서 2초간 보여준 뒤, 스르르 천천히 사라짐
      // 2) 2초가 지나기 전에 마우스 휠 / 마우스 드래그 / 터치 이동이 감지되면
      //    기다리지 않고 즉시 "스르륵!" 하고 빠르게 사라짐
      (function () {
        const guide = document.getElementById("idle-guide-popup");
        const SHOW_DURATION = 2000; // 팝업을 보여주는 시간(ms) → 바꾸려면 이 숫자 수정
        let hidden = false;
        let timer;
        let mouseIsDown = false;

        function hideGuide(fast) {
          if (hidden) return;
          hidden = true;
          clearTimeout(timer);
          // fast=true  → .fast 클래스로 빠르게 (0.35초) 사라짐
          // fast=false → 기본 transition으로 천천히 (1.2초) 사라짐
          if (fast) guide.classList.add("fast");
          guide.classList.remove("show");
        }

        // 나타나기
        requestAnimationFrame(() => guide.classList.add("show"));

        // 2초 뒤 자연스럽게 스르르 사라짐
        timer = setTimeout(() => hideGuide(false), SHOW_DURATION);

        // 휠 반응 → 바로 스르륵!
        window.addEventListener("wheel", () => hideGuide(true), {
          passive: true,
        });

        // 마우스 드래그 반응 → 바로 스르륵! (버튼을 누른 채로 움직였을 때)
        window.addEventListener("mousedown", () => (mouseIsDown = true));
        window.addEventListener("mouseup", () => (mouseIsDown = false));
        window.addEventListener("mousemove", () => {
          if (mouseIsDown) hideGuide(true);
        });

        // 터치 드래그 (모바일)
        window.addEventListener("touchmove", () => hideGuide(true), {
          passive: true,
        });
      })();
    </script>
  </body>

  <div class="cursor" aria-hidden="true">
    <div class="cursor-inner">
      <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <!-- 바깥 30% -->
        <path
          fill="#FF008C"
          fill-opacity="0.3"
          fill-rule="evenodd"
          d="M50,4 L94,100 L50,74 L6,100 Z M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z"
        />
        <!-- 중간 60% -->
        <path
          fill="#FF008C"
          fill-opacity="0.6"
          fill-rule="evenodd"
          d="M50,23.8 L79.9,89.1 L50,71.4 L20.1,89.1 Z M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z"
        />
        <!-- 중심 100% -->
        <path fill="#FF008C" d="M50,43.7 L65.8,78.2 L50,68.9 L34.2,78.2 Z" />
      </svg>
    </div>
  </div>

  <style>
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cursor-ready .cursor {
      opacity: 1;
    }

    .cursor-inner {
      position: absolute;
      left: calc(-19 * var(--u));
      top: calc(-3 * var(--u));
      width: calc(38 * var(--u));
      height: calc(42 * var(--u));
      transform: rotate(-30deg);
      transform-origin: 50% 8%;
      filter: drop-shadow(0 0 calc(5 * var(--u)) rgba(255, 0, 98, 0.538))
        drop-shadow(0 0 calc(14 * var(--u)) rgba(255, 0, 98, 0.3));
      transition:
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.3s ease;
    }

    .cursor-inner svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cursor-hover .cursor-inner,
    .cursor-scan .cursor-inner {
      transform: rotate(-30deg) scale(0.55);
      filter: drop-shadow(0 0 calc(7 * var(--u)) rgba(255, 0, 98, 0.538))
        drop-shadow(0 0 calc(20 * var(--u)) rgba(255, 0, 98, 0.3));
    }

    .cursor-down .cursor-inner {
      transform: rotate(-30deg) scale(0.85);
    }

    html.has-custom-cursor,
    html.has-custom-cursor * {
      cursor: none !important;
    }
  </style>

  <script>
    (function () {
      const finePointer = window.matchMedia(
        "(hover: hover) and (pointer: fine)",
      ).matches;
      if (!finePointer) return;

      const root = document.documentElement;
      const cursor = document.querySelector(".cursor");
      root.classList.add("has-custom-cursor");

      window.addEventListener("mousemove", (e) => {
        cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        root.classList.add("cursor-ready");
      });

      document.addEventListener("mouseover", (e) => {
        const t = e.target;
        root.classList.remove("cursor-hover", "cursor-scan");
        if (t.closest("[data-cursor='scan']")) {
          root.classList.add("cursor-scan");
        } else if (t.closest("a, button, [data-cursor]")) {
          root.classList.add("cursor-hover");
        }
      });

      window.addEventListener("mousedown", () =>
        root.classList.add("cursor-down"),
      );
      window.addEventListener("mouseup", () =>
        root.classList.remove("cursor-down"),
      );
      document.addEventListener("mouseleave", () =>
        root.classList.remove("cursor-ready"),
      );
      document.addEventListener("mouseenter", () =>
        root.classList.add("cursor-ready"),
      );
    })();
  </script>
  <script>
    /* =========================================================
     4) 3분간 무반응 시 메인(index.html)으로 자동 이동
  ========================================================= */
    (function () {
      const IDLE_LIMIT = 3 * 60 * 1000; // 3분 (ms)
      const REDIRECT_URL = "index.html";
      let idleTimer;

      function goHome() {
        window.location.href = REDIRECT_URL;
      }

      function resetTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(goHome, IDLE_LIMIT);
      }

      // 사용자 반응으로 간주할 이벤트들
      [
        "mousemove",
        "mousedown",
        "mouseup",
        "click",
        "wheel",
        "keydown",
        "touchstart",
        "touchmove",
        "scroll",
      ].forEach((evt) =>
        window.addEventListener(evt, resetTimer, { passive: true }),
      );

      resetTimer();
    })();
  </script>

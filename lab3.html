<!doctype html>
<html lang="ko">
  <head>
    <style>
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
        height: 100vh;
        color: white;
        font-family: sans-serif;
      }
      .carousel-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
      }
      .image-card {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 20px;
        object-fit: cover;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      /* 글자 영역 스타일 */
      #text-box {
        position: absolute;
        bottom: 20%;
        width: 100%;
        text-align: center;
        pointer-events: none;
      }
      #title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      #caption {
        font-size: 16px;
        color: #888;
      } /* 작은 캡션 스타일 */
    </style>
  </head>
  <body>
    <div class="carousel-container" id="carousel"></div>

    <div id="text-box">
      <div id="title">질병 1</div>
      <div id="caption">더미글더미글더미글</div>
    </div>

    <script>
      const container = document.getElementById("carousel");
      const titleEl = document.getElementById("title");
      const totalImages = 20;
      const images = [
        "IMG_7411.png",
        "IMG_7412.png",
        "IMG_7413.png",
        "IMG_7414.png",
        "IMG_7415.png",
        "IMG_7416.png",
        "IMG_7417.png",
        "IMG_7418.png",
      ];

      // 질병 이름과 캡션을 가진 배열
      const content = Array.from({ length: totalImages }, (_, i) => ({
        title: `질병 ${i + 1}`,
        caption: "더미글더미글더미글",
      }));

      let currentIndex = 0;
      const radius = 500;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight + 150;

      for (let i = 0; i < totalImages; i++) {
        const img = document.createElement("img");
        img.src = images[i % images.length];
        img.className = "image-card";
        img.onerror = () => {
          img.src = `https://via.placeholder.com/150/444/fff?text=IMG`;
        };
        container.appendChild(img);
      }

      function updatePositions() {
        const cards = document.querySelectorAll(".image-card");
        cards.forEach((card, i) => {
          const angle = ((i - currentIndex) / totalImages) * Math.PI * 2;
          const x = Math.cos(angle - Math.PI / 2) * radius + centerX;
          const y = Math.sin(angle - Math.PI / 2) * radius + centerY;

          card.style.left = `${x - 50}px`;
          card.style.top = `${y - 50}px`;
        });

        // 텍스트 업데이트
        const activeIdx =
          ((currentIndex % totalImages) + totalImages) % totalImages;
        titleEl.innerText = content[activeIdx].title;
      }

      let isDragging = false;
      let startX;

      container.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
      });
      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const diff = e.clientX - startX;
        if (Math.abs(diff) > 100) {
          currentIndex += diff > 0 ? -1 : 1;
          startX = e.clientX;
          updatePositions();
        }
      });
      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      updatePositions();
    </script>
  </body>
</html>
